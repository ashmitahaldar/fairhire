name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  type-check-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run type-check --workspaces --if-present
      - run: npm run lint
