services:
  - type: web
    name: fairhire-api
    runtime: node
    rootDir: .
    buildCommand: npm install && npx prisma generate && (cd shared && npm run build) && (cd api && npm run build)
    startCommand: node api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # set in Render dashboard — app_user pooled connection
      - key: DIRECT_URL
        sync: false   # set in Render dashboard — postgres direct connection
      - key: CLERK_SECRET_KEY
        sync: false   # set in Render dashboard
      - key: INTERNAL_API_SECRET
        sync: false   # set in Render dashboard — generate with: openssl rand -hex 32
